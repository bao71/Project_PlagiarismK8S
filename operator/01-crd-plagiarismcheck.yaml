apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: plagiarismchecks.plagiarism.io

spec:
  group: plagiarism.io
  scope: Namespaced

  names:
    plural: plagiarismchecks
    singular: plagiarismcheck
    kind: plagiarismcheck
    shortNames:
      - pc

  versions:
    - name: v1
      served: true
      storage: true

      subresources:
        status: {}

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                subjectId:
                  type: string

                originalFilePath:
                  type: string

                # Không dùng nữa trong kiến trúc preprocess-server,
                # nhưng vẫn giữ optional để không lỗi nếu CR cũ còn field này.
                outputPreprocess:
                  type: string

                # Final result path.
                # Nếu không truyền, operator sẽ tự dùng:
                # minio://results/<check-name>/result.json
                outputResult:
                  type: string

                # Số Pod stage 2 compare chạy song song.
                # Ví dụ 5 pod thì comparePods: 5
                comparePods:
                  type: integer
                  minimum: 1
                  default: 5

              required:
                - subjectId
                - originalFilePath

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true