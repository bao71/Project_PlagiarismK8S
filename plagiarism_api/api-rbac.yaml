apiVersion: v1
kind: ServiceAccount
metadata:
  name: plagiarism-api-sa
  namespace: plagiarism

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plagiarism-api-role
  namespace: plagiarism
rules:
  - apiGroups:
      - plagiarism.io
    resources:
      - plagiarismchecks
      - plagiarismchecks/status
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plagiarism-api-rolebinding
  namespace: plagiarism
subjects:
  - kind: ServiceAccount
    name: plagiarism-api-sa
    namespace: plagiarism
roleRef:
  kind: Role
  name: plagiarism-api-role
  apiGroup: rbac.authorization.k8s.io